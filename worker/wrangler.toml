name = "trap-houze-cms"
main = "src/index.js"
compatibility_date = "2026-08-12"

[vars]
# URL onde o admin está publicado (sem barra final).
ADMIN_ORIGIN = "https://traphouzerecords.com"
REPO_OWNER = "trap-houze-records"
REPO_NAME = "traphouzerecords.com"
BRANCH = "main"
CONTENT_PATH = "data/site.json"
# Utilizadores GitHub autorizados a abrir o painel, separados por vírgula.
ALLOWED_GITHUB_USERS = "trap-houze-records"
# ID da instalação da GitHub App neste repositório.
GITHUB_INSTALLATION_ID = "153174915"
GOOGLE_CALENDAR_DEFAULT_ID = "bab49f46fa47e6fb7a9ffc1fe4ec50ccf2922a6775ffc14891d2bafe2d053537@group.calendar.google.com"
GOOGLE_CALENDAR_DEFAULT_NAME = "Booking"
BOOKING_NOTIFICATION_EMAIL = "traphouzerec@gmail.com"
BOOKING_NOTIFICATION_FROM = "Agenda Trap Houze <reservas@notify.traphouzerecords.com>"

[[d1_databases]]
binding = "CLIENT_PORTAL_DB"
database_name = "trap-houze-client-portal"
database_id = "aa038bcd-3a07-48d6-8e84-d3352b1ef121"

[[r2_buckets]]
binding = "CLIENT_AUDIO"
bucket_name = "trap-houze-client-audio"

# Criar como secrets no Cloudflare, nunca neste ficheiro:
# GITHUB_OAUTH_CLIENT_ID
# GITHUB_OAUTH_CLIENT_SECRET
# GITHUB_APP_ID
# GITHUB_APP_PRIVATE_KEY
# SESSION_SECRET (uma string aleatória longa)
# GOOGLE_SERVICE_ACCOUNT_EMAIL
# GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
# RESEND_API_KEY
